      checkBrawlerUnlock() {
          let bKey = this.trophies.unlockingBrawler;
          if (!bKey) return false;
          
          // Skip already owned brawlers (e.g. if got from drop)
          if (this.trophies.brawlers[bKey] !== undefined) {
              const orderIdx = UNLOCK_ORDER.indexOf(bKey);
              if (orderIdx !== -1 && orderIdx < UNLOCK_ORDER.length - 1) {
                  this.trophies.unlockingBrawler = UNLOCK_ORDER[orderIdx + 1];
                  return this.checkBrawlerUnlock(); // Recurse to skip
              } else {
                  this.trophies.unlockingBrawler = null;
                  return false;
              }
          }

          const cost = CREDITS_COSTS[bKey] || 0;
          if (this.trophies.credits >= cost) {
              this.trophies.credits -= cost;
              this.trophies.brawlers[bKey] = 0;
              this.trophies.brawlerLevels[bKey] = 1;
              
              // Find next in order that isn't owned
              let nextBrawler = null;
              const orderIdx = UNLOCK_ORDER.indexOf(bKey);
              for (let i = orderIdx + 1; i < UNLOCK_ORDER.length; i++) {
                  if (this.trophies.brawlers[UNLOCK_ORDER[i]] === undefined) {
                      nextBrawler = UNLOCK_ORDER[i];
                      break;
                  }
              }
              this.trophies.unlockingBrawler = nextBrawler;
              
              j(this.trophies);
              this.showUnlockAnimation(w[bKey]);
              return true;
          }
          return false;
      }

              t.dx = 0; t.dy = 0; t.rangeRemaining = 99999; t.createdAt = e; t.duration = t.isSuper ? 6000 : 2000; t.type = "tick_mine"; continue;
            } else if (t.type === "squeak_main") {
              this.zones.push({ id: Math.random() + "", ownerId: t.ownerId, x: t.x, y: t.y, radius: 120, duration: 1000, createdAt: e, damage: t.damage, isSqueakBomb: true });
              this.bullets.splice(s, 1); continue;
            } else if (t.type === "squeak_super") {
              this.zones.push({ id: Math.random() + "", ownerId: t.ownerId, x: t.x, y: t.y, radius: 300, duration: 5000, createdAt: e, damage: 500, isCircle: true });
              this.bullets.splice(s, 1); continue;
            } else if (t.type === "grom_main" || t.type === "grom_super") {
                let dirs = [0, Math.PI/2, Math.PI, 3*Math.PI/2];
                let isSuper = t.type === "grom_super";
                dirs.forEach(d => {
                  this.bullets.push({ id: Math.random()+"", ownerId: t.ownerId, x: t.x, y: t.y, dx: Math.cos(d)*10, dy: Math.sin(d)*10, damage: t.damage, rangeRemaining: isSuper ? 300 : 200, size: isSuper ? 20 : 12, color: "#ef4444", type: "grom_sub", isSuper: isSuper, hitIds: [] });
                });
            } else if (t.type === "dynamike_main" || t.type === "dynamike_super") {
                this.zones.push({ id: Math.random() + "", ownerId: t.ownerId, x: t.x, y: t.y, radius: t.type === "dynamike_super" ? 200 : 100, duration: 500, createdAt: e, damage: t.damage });
            } else if (t.type === "amber_oil" || t.type === "penny_cannon_shot") {
              this.zones.push({ id: Math.random() + "", ownerId: t.ownerId, x: t.x, y: t.y, radius: 100, duration: 6000, createdAt: e, damage: 500 });
            } else if (t.type === "barley_main") {
              this.zones.push({ id: Math.random() + "", ownerId: t.ownerId, x: t.x, y: t.y, radius: 80, duration: 2500, createdAt: e, damage: 600 });
            } else if (t.type === "barley_super") {
              this.zones.push({ id: Math.random() + "", ownerId: t.ownerId, x: t.x, y: t.y, radius: 150, duration: 4000, createdAt: e, damage: 800 });
            } else if (t.type === "sprout_main") {
              if (t.canBounce) {
                t.rangeRemaining = 150; t.canBounce = false; continue;
              }
              this.zones.push({ id: Math.random() + "", ownerId: t.ownerId, x: t.x, y: t.y, radius: 80, duration: 800, createdAt: e, damage: t.damage });
            } else if (t.type === "sprout_wall") {
              this.tempWalls.push({ x: t.x - 50, y: t.y - 50, width: 100, height: 100, createdAt: e, duration: 6000 });
            }
            if (t.type !== "tick_mine") { this.bullets.splice(s, 1); continue; }
          }
          // Wall collision for bullets
          let hit = false;
          const throwers = ["tick", "barley_main", "barley_super", "sprout_wall", "grom_main", "grom_super", "dynamike_main", "dynamike_super"];
          if (!throwers.includes(t.type)) {
            let allWalls = [...this.walls, ...this.tempWalls];
            for (let i = allWalls.length - 1; i >= 0; i--) {
              let w = allWalls[i];
              if (t.x >= w.x && t.x <= w.x + w.width && t.y >= w.y && t.y <= w.y + w.height) {
                if (t.isSuper && (t.type === "shelly" || t.type === "colt")) {
                  let originalIndex = this.walls.indexOf(w);
                  if (originalIndex !== -1) this.walls.splice(originalIndex, 1);
                  else {
                      let tempIndex = this.tempWalls.indexOf(w);
                      if (tempIndex !== -1) this.tempWalls.splice(tempIndex, 1);
                  }
                  // Pierce through walls
                } else if (t.type === "squeak_main") {
                   this.zones.push({ id: Math.random() + "", ownerId: t.ownerId, x: t.x, y: t.y, radius: 120, duration: 1000, createdAt: e, damage: t.damage, isSqueakBomb: true });
                   hit = true; break;
                } else if (t.type === "squeak_super") {
                   this.zones.push({ id: Math.random() + "", ownerId: t.ownerId, x: t.x, y: t.y, radius: 300, duration: 5000, createdAt: e, damage: 500, isCircle: true });
                   hit = true; break;
                } else if (t.canBounce) {
                  let overlapLeft = Math.abs(t.x - w.x);
                  let overlapRight = Math.abs(t.x - (w.x + w.width));
                  let overlapTop = Math.abs(t.y - w.y);
                  let overlapBottom = Math.abs(t.y - (w.y + w.height));
                  let minOverlap = Math.min(overlapLeft, overlapRight, overlapTop, overlapBottom);
                  
                  if (minOverlap === overlapLeft) { t.dx = -Math.abs(t.dx); t.x = w.x - 1; }
                  else if (minOverlap === overlapRight) { t.dx = Math.abs(t.dx); t.x = w.x + w.width + 1; }
                  else if (minOverlap === overlapTop) { t.dy = -Math.abs(t.dy); t.y = w.y - 1; }
                  else if (minOverlap === overlapBottom) { t.dy = Math.abs(t.dy); t.y = w.y + w.height + 1; }

                  if (t.type === "sprout_main") {
                    t.canBounce = false;
                    t.rangeRemaining += 100;
                  } else if (t.type === "rico") {
                    t.rangeRemaining += 150;
                  }
                } else {
                  hit = true;
                  break;
                }
              }
            }
          }

          if (!hit) {
            let targets = [this.player, ...this.bots, ...this.boxes.filter(b => !b.isDestroyed), ...this.creatures];
            for (let target of targets) {
              if (target.id !== t.ownerId && !t.hitIds?.includes(target.id) && Math.hypot(t.x - target.x, t.y - target.y) < target.size) {
                let owner = [this.player, ...this.bots].find(n => n.id === t.ownerId);
                // Friendly Fire Check for Brawl Ball
                if (this.gameMode === "BRAWL_BALL" && target.team && owner && target.team === owner.team) continue;

                if (t.type === "squeak_main") {
                  this.zones.push({ id: Math.random() + "", ownerId: t.ownerId, x: target.x, y: target.y, radius: 120, duration: 1000, createdAt: e, damage: t.damage, isSqueakBomb: true, attachedToId: target.id });
                  hit = true; break;
                }
                if (t.type === "squeak_super") {
                  this.zones.push({ id: Math.random() + "", ownerId: t.ownerId, x: t.x, y: t.y, radius: 300, duration: 5000, createdAt: e, damage: 500, isCircle: true });
                  hit = true; break;
                }

                target.hp -= (t.type === "colette" ? target.maxHp * 0.33 : t.damage) * (target.damageResist || 1); target.lastCombatTime = e;
                if (t.hitIds) t.hitIds.push(target.id);
                if (target.hp <= 0) target.killerId = owner.id; // Track killer for Bounty
                if (owner && !target.id.startsWith("box")) {
                  // Reduced super charge from super damage to prevent infinite chains
                  let chargeRate = t.isSuper ? 60 : 30;
                  owner.superCharge = Math.min(100, owner.superCharge + t.damage / chargeRate);
                  if (owner.config.type === "crow" && "hp" in target) {
                    target.poison = { ownerId: owner.id, damage: 80 * (1 + 0.1 * owner.powerCubes), ticks: 4, lastTick: e };
                  }
                  if (owner.config.type === "carl" && t.type === "carl_main") {
                    owner.hasPickaxe = false;
                  }
                }
                if (!t.isSuper && t.type !== "carl_main" && t.type !== "penny_cannon_shot" || t.type === "shelly" || t.type === "colt" || t.type === "crow") { hit = true; break; }
              }
            }
          }
          if (hit) { this.bullets.splice(s, 1); continue; }
        }
        [this.player, ...this.bots].forEach((s, t) => { 
          if (s.hp <= 0) { 
            if (this.gameMode === "SHOWDOWN") {
              if (s.id !== "player") {
                this.cubes.push({ x: s.x, y: s.y, size: 20, createdAt: e }); 
                this.bots = this.bots.filter(b => b.id !== s.id);
              }
            } else {
              if (!s.deathHandled) {
                if (this.gameMode === "BOUNTY") {
                  const killer = [this.player, ...this.bots].find(b => b.id === s.killerId);
                  if (killer) {
                    if (killer.team === "blue") this.scores.blue += s.stars || 2;
                    else this.scores.red += s.stars || 2;
                    killer.stars = Math.min(7, (killer.stars || 2) + 1);
                  }
                }
                if (this.gameMode === "GEM_GRAB" && s.gems > 0) {
                  for(let i=0; i<s.gems; i++) {
                    this.cubes.push({ x: s.x + (Math.random()-0.5)*100, y: s.y + (Math.random()-0.5)*100, size: 20, createdAt: e, type: "GEM" });
                  }
                  s.gems = 0;
                }
                s.deathHandled = true;
                s.killerId = null;
              }
            }
          } else {
            s.deathHandled = false;
          }
        });
        this.boxes.forEach(s => { if (!s.isDestroyed && s.hp <= 0) { s.isDestroyed = !0; this.cubes.push({ x: s.x, y: s.y, size: 20, createdAt: e }); } });
        for (let s = this.cubes.length - 1; s >= 0; s--) {
          let t = this.cubes[s];
          [this.player, ...this.bots].forEach(o => {
            if (Math.hypot(o.x - t.x, o.y - t.y) < o.size + 20) {
              o.powerCubes++; o.maxHp += 400; o.hp = Math.min(o.maxHp, o.hp + 400);
              this.cubes.splice(s, 1);
            }
          });
        }
      }

      draw() {
        this.ctx.fillStyle = "#854d0e";
        this.ctx.fillRect(0, 0, this.viewport.w, this.viewport.h);

        this.ctx.save();
        this.ctx.translate(-this.camera.x, -this.camera.y);

        // Map grid
        for (let y = 0; y < this.mapH; y += 100) {
          if (y < this.camera.y - 100 || y > this.camera.y + this.viewport.h) continue;
          for (let x = 0; x < this.mapW; x += 100) {
            if (x < this.camera.x - 100 || x > this.camera.x + this.viewport.w) continue;
            this.ctx.fillStyle = (x / 100 + y / 100) % 2 === 0 ? "#a16207" : "#854d0e";
            this.ctx.fillRect(x, y, 100, 100);
          }
        }

        if (this.state === "GAME" && this.player) {
          // Aiming guide
          let p = this.player;
          let isSuper = this.isAimingSuper;
          let range = isSuper ? p.config.range + 100 : p.config.range;
          let color = isSuper ? "rgba(251, 191, 36, 0.4)" : "rgba(255, 255, 255, 0.15)";

          this.ctx.save();
          this.ctx.translate(p.x, p.y);
          this.ctx.rotate(p.angle);

          if (p.config.type === "shelly") {
            let cone = isSuper ? 0.6 : 0.4;
            this.ctx.fillStyle = color;
            this.ctx.beginPath();
            this.ctx.moveTo(0, 0);
            this.ctx.arc(0, 0, range, -cone / 2, cone / 2);
            this.ctx.closePath();
            this.ctx.fill();
          } else if (p.config.type === "crow" && !isSuper) {
            this.ctx.strokeStyle = color;
            this.ctx.lineWidth = 4;
            for (let r = -1; r <= 1; r++) {
              let ang = r * 0.2;
              this.ctx.beginPath();
              this.ctx.moveTo(0, 0);
              this.ctx.lineTo(Math.cos(ang) * range, Math.sin(ang) * range);
              this.ctx.stroke();
            }
          } else if (p.config.type === "ash" && !isSuper) {
              this.ctx.fillStyle = color;
              this.ctx.fillRect(0, -50, range, 100);
          } else if (p.config.type === "jacky" && !isSuper) {
              this.ctx.fillStyle = color;
              this.ctx.beginPath();
              this.ctx.arc(0, 0, 180, 0, Math.PI * 2);
              this.ctx.fill();
          } else if (p.config.type === "carl" && !isSuper) {
              this.ctx.fillStyle = color;
              this.ctx.fillRect(0, -15, range, 30);
          } else if (p.config.type === "colt" || p.config.type === "gus" || p.config.type === "chuck" || p.config.type === "brock" || p.config.type === "rico" || p.config.type === "eightbit") {
            let width = isSuper ? 40 : 20;
            this.ctx.fillStyle = color;
            this.ctx.fillRect(0, -width / 2, range + (isSuper && p.config.type === "colt" ? 200 : 0), width);
          } else if (p.config.type === "colette") {
            let width = isSuper ? 60 : 30;
            this.ctx.fillStyle = color;
            this.ctx.fillRect(0, -width / 2, range, width);
          } else if (p.config.type === "griff" || p.config.type === "emz") {
            let cone = isSuper ? 0.8 : 0.4;
            this.ctx.fillStyle = color;
            this.ctx.beginPath();
            this.ctx.moveTo(0, 0);
            this.ctx.arc(0, 0, range, -cone / 2, cone / 2);
            this.ctx.closePath();
            this.ctx.fill();
          } else if (p.config.type === "poco" || p.config.type === "frank") {
            let cone = isSuper ? 1.2 : 1.0;
            this.ctx.fillStyle = color;
            this.ctx.beginPath();
            this.ctx.moveTo(0, 0);
            this.ctx.arc(0, 0, range, -cone / 2, cone / 2);
            this.ctx.closePath();
            this.ctx.fill();
          } else if (p.config.type === "tick" || p.config.type === "barley" || p.config.type === "sprout" || p.config.type === "spike" || p.config.type === "edgar" || p.config.type === "el_primo" || p.config.type === "grom" || p.config.type === "dynamike" || (p.config.type === "crow" && isSuper) || (p.config.type === "penny" && isSuper) || (p.config.type === "mortis" && isSuper)) {
            let dist = Math.min(Math.hypot(this.mouse.x + this.camera.x - p.x, this.mouse.y + this.camera.y - p.y), range);
            this.ctx.strokeStyle = color;
            this.ctx.setLineDash([10, 5]);
            this.ctx.lineWidth = 4;
            this.ctx.beginPath();
            this.ctx.moveTo(0, 0);
            this.ctx.lineTo(dist, 0);
            this.ctx.stroke();
            this.ctx.setLineDash([]);
            this.ctx.fillStyle = color;
            this.ctx.beginPath();
            let radius = 40;
            if (p.config.type === "spike" && isSuper) radius = 120;
            if (p.config.type === "barley" && isSuper) radius = 150;
            if (p.config.type === "tick" && !isSuper) radius = 60;
            if (p.config.type === "edgar" || p.config.type === "el_primo" || (p.config.type === "crow" && isSuper)) radius = 60;
            if (p.config.type === "sprout") radius = isSuper ? 100 : 60;
            if (p.config.type === "grom") radius = isSuper ? 120 : 70;
            if (p.config.type === "dynamike") radius = isSuper ? 140 : 80;
            if (p.config.type === "mortis" && isSuper) radius = 100;
            this.ctx.arc(dist, 0, radius, 0, Math.PI * 2);
            this.ctx.fill();
          } else if (p.config.type === "mortis" && !isSuper) {
              // Dash indicator line
              this.ctx.strokeStyle = "rgba(255,255,255,0.5)";
              this.ctx.lineWidth = 6;
              this.ctx.beginPath();
              this.ctx.moveTo(0, 0);
              this.ctx.lineTo(300, 0);
              this.ctx.stroke();
          } else if (p.config.type === "amber") {
            if (isSuper) {
              let dist = Math.min(Math.hypot(this.mouse.x + this.camera.x - p.x, this.mouse.y + this.camera.y - p.y), range);
              this.ctx.strokeStyle = color;
              this.ctx.setLineDash([10, 5]);
              this.ctx.lineWidth = 4;
              this.ctx.beginPath();
              this.ctx.moveTo(0, 0);
              this.ctx.lineTo(dist, 0);
              this.ctx.stroke();
              this.ctx.setLineDash([]);
              this.ctx.fillStyle = color;
              this.ctx.beginPath();
              this.ctx.arc(dist, 0, 100, 0, Math.PI * 2);
              this.ctx.fill();
            } else {
              this.ctx.fillStyle = color;
              this.ctx.fillRect(0, -10, range, 20);
            }
          } else if (p.config.type === "darryl") {
            this.ctx.fillStyle = color;
            this.ctx.beginPath();
            this.ctx.moveTo(0, 0);
            this.ctx.arc(0, 0, range, -0.5 / 2, 0.5 / 2);
            this.ctx.closePath();
            this.ctx.fill();
          }
          this.ctx.restore();
        }

        // Map Border
        this.ctx.strokeStyle = "#ef4444";
        this.ctx.lineWidth = 10;
        this.ctx.strokeRect(0, 0, this.mapW, this.mapH);

        if (this.gameMode === "SHOWDOWN" && this.currentPoisonRadius) {
          this.ctx.save();
          this.ctx.globalAlpha = 0.4;
          this.ctx.fillStyle = "#22c55e";
          this.ctx.beginPath();
          this.ctx.moveTo(-1000, -1000);
          this.ctx.lineTo(d + 1000, -1000);
          this.ctx.lineTo(d + 1000, d + 1000);
          this.ctx.lineTo(-1000, d + 1000);
          this.ctx.lineTo(-1000, -1000);
          this.ctx.arc(d/2, d/2, this.currentPoisonRadius, 0, Math.PI * 2, true);
          this.ctx.fill();
          this.ctx.restore();
        }

        if (this.gameMode === "BRAWL_BALL") {
          this.ctx.fillStyle = "rgba(59, 130, 246, 0.4)";
          this.ctx.fillRect(350, -50, 300, 100);
          this.ctx.fillStyle = "rgba(239, 68, 68, 0.4)";
          this.ctx.fillRect(350, 1950, 300, 100);
          if (this.ball) {
            this.ctx.save();
            this.ctx.translate(this.ball.x, this.ball.y);
            this.ctx.rotate(Date.now() / 300);
            this.ctx.font = "40px Arial";
            this.ctx.textAlign = "center";
            this.ctx.textBaseline = "middle";
            this.ctx.fillText("⚽", 0, 0);
            this.ctx.restore();
          }
        }

        // Walls
        this.walls.forEach(w => {
          this.ctx.fillStyle = "#475569";
          this.ctx.fillRect(w.x, w.y, w.width, w.height);
          this.ctx.fillStyle = "#64748b";
          this.ctx.fillRect(w.x + 10, w.y + 10, w.width - 20, w.height - 20);
        });

        // Draw Chuck Track Connections
        for (let i = 0; i < this.posts.length; i++) {
          for (let j = i + 1; j < this.posts.length; j++) {
            let p1 = this.posts[i], p2 = this.posts[j];
            if (p1.ownerId === p2.ownerId && Math.hypot(p1.x - p2.x, p1.y - p2.y) < 800) {
              this.ctx.strokeStyle = "rgba(185, 28, 28, 0.4)";
              this.ctx.lineWidth = 15;
              this.ctx.setLineDash([20, 10]);
              this.ctx.beginPath();
              this.ctx.moveTo(p1.x, p1.y);
              this.ctx.lineTo(p2.x, p2.y);
              this.ctx.stroke();
              this.ctx.setLineDash([]);
            }
          }
        }

        // Draw Chuck Posts
        this.posts.forEach(p => {
          this.ctx.fillStyle = "#b91c1c";
          this.ctx.beginPath();
          this.ctx.arc(p.x, p.y, 25, 0, Math.PI * 2);
          this.ctx.fill();
          this.ctx.strokeStyle = "white";
          this.ctx.lineWidth = 3;
          this.ctx.stroke();
          this.ctx.font = "24px Arial";
          this.ctx.textAlign = "center";
          this.ctx.fillText("🚩", p.x, p.y + 8);
        });

        // Zones (Poison/Aura)
        this.zones.forEach(z => {
          if (z.isZone) {
              this.ctx.fillStyle = "rgba(59, 130, 246, 0.15)";
              this.ctx.beginPath();
              this.ctx.arc(z.x, z.y, z.radius, 0, Math.PI * 2);
              this.ctx.fill();
              this.ctx.strokeStyle = "rgba(59, 130, 246, 0.4)";
              this.ctx.lineWidth = 8;
              this.ctx.stroke();
              return;
          }
          if (z.isSqueakBomb) {
              this.ctx.fillStyle = "rgba(16, 185, 129, 0.6)";
              this.ctx.beginPath();
              this.ctx.arc(z.x, z.y, 25, 0, Math.PI * 2);
              this.ctx.fill();
              this.ctx.font = "30px Arial";
              this.ctx.textAlign = "center";
              this.ctx.fillText("🎾", z.x, z.y + 10);
              return;
          }
          this.ctx.fillStyle = z.isShield ? "rgba(147, 197, 253, 0.3)" : (z.isStun ? "rgba(234, 179, 8, 0.3)" : "rgba(34, 197, 94, 0.2)");
          if (z.isShield) {
              this.ctx.shadowColor = "#93c5fd";
              this.ctx.shadowBlur = 10;
          }
          this.ctx.beginPath();
          this.ctx.arc(z.x, z.y, z.radius, 0, Math.PI * 2);
          this.ctx.fill();
          this.ctx.shadowBlur = 0;
          if (z.isShield) {
              this.ctx.font = "24px Arial";
              this.ctx.textAlign = "center";
              this.ctx.fillText("🛡️", z.x, z.y + 8);
          }
        });

        // Boxes
        this.boxes.forEach(b => {
          if (!b.isDestroyed) {
            this.ctx.fillStyle = "#b45309";
            this.ctx.fillRect(b.x - b.size / 2, b.y - b.size / 2, b.size, b.size);
            // Health bar
            this.ctx.fillStyle = "#f59e0b";
            this.ctx.fillRect(b.x - b.size / 2, b.y - b.size / 2 - 15, b.size * (b.hp / b.maxHp), 6);
          }
        });

        // Cubes
        this.cubes.forEach(c => {
          this.ctx.shadowColor = "#60a5fa";
          this.ctx.shadowBlur = 10 + Math.sin((Date.now() - (c.createdAt || 0)) / 100) * 8;
          this.ctx.fillStyle = "#3b82f6";
          this.ctx.beginPath();
          this.ctx.arc(c.x, c.y, c.size, 0, Math.PI * 2);
          this.ctx.fill();
          this.ctx.shadowBlur = 0;
        });

        // Bullets / Projectiles
        this.bullets.forEach(b => {
          this.ctx.fillStyle = b.color;
          if (b.type === "tick_mine") {
            this.ctx.shadowColor = "#ef4444";
            this.ctx.shadowBlur = 15;
          }
          this.ctx.beginPath();
          this.ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
          this.ctx.fill();
          this.ctx.shadowBlur = 0;
        });

        // Temp Walls
        this.tempWalls.forEach(h => {
          this.ctx.fillStyle = "#4ade80";
          this.ctx.globalAlpha = 0.8;
          this.ctx.fillRect(h.x, h.y, h.width, h.height);
          this.ctx.strokeStyle = "white";
          this.ctx.lineWidth = 2;
          this.ctx.strokeRect(h.x, h.y, h.width, h.height);
          this.ctx.globalAlpha = 1.0;
          this.ctx.font = "40px Arial";
          this.ctx.textAlign = "center";
          this.ctx.fillText("💠", h.x + h.width / 2, h.y + h.height / 2 + 15);
        });

        // Brawlers
        [this.player, ...this.bots].filter(b => b && b.hp > 0).forEach(b => {
          if (!b.config) {
             console.log("Missing config for:", b);
             return;
          }
          // Synergy Aura
          if (b.hasSynergy) {
            this.ctx.save();
            this.ctx.translate(b.x, b.y);
            this.ctx.globalAlpha = 0.3 + Math.sin(Date.now() / 200) * 0.1;
            this.ctx.fillStyle = "#fbbf24"; // Gold color for Bandstand trio
            this.ctx.beginPath();
            this.ctx.arc(0, 0, b.size + 15, 0, Math.PI * 2);
            this.ctx.fill();
            this.ctx.restore();
          }

          this.ctx.save();
          this.ctx.translate(b.x, b.y);
          this.ctx.rotate(b.angle);

          // Body
          this.ctx.fillStyle = b.config.color;
          if (b.config.trio === "Ghost Station") this.ctx.globalAlpha = 0.7; // Ghostly effect
          this.ctx.beginPath();
          this.ctx.arc(0, 0, b.size, 0, Math.PI * 2);
          this.ctx.fill();
          this.ctx.globalAlpha = 1.0;

          // Barrel / Direction indicator
          this.ctx.fillStyle = "white";
          this.ctx.fillRect(b.size * 0.5, -5, 10, 10);

          this.ctx.restore();

          // Poison effect rendering
          if (b.poison) {
            this.ctx.save();
            this.ctx.translate(b.x, b.y);
            this.ctx.globalAlpha = 0.4;
            this.ctx.fillStyle = "#a855f7";
            this.ctx.beginPath();
            this.ctx.arc(0, 0, b.size + 10, 0, Math.PI * 2);
            this.ctx.fill();
            this.ctx.restore();
          }

          // Emoji / Icon
          this.ctx.font = "24px Arial";
          this.ctx.textAlign = "center";
          this.ctx.fillText(b.config.emoji, b.x, b.y + 8);

          // Power Cube Count
          if (b.powerCubes > 0) {
            this.ctx.font = "bold 14px Arial";
            this.ctx.fillStyle = "#fbbf24";
            this.ctx.textAlign = "left";
            this.ctx.fillText("⚡ " + b.powerCubes, b.x + 35, b.y - b.size - 15);
          }

          if (this.gameMode === "GEM_GRAB" && b.gems > 0) {
            this.ctx.font = "bold 14px Arial";
            this.ctx.fillStyle = "#a855f7";
            this.ctx.textAlign = "left";
            this.ctx.fillText("💎 " + b.gems, b.x + 35, b.y - b.size);
          }

          if (this.gameMode === "BOUNTY" && b.stars > 0) {
            this.ctx.font = "bold 14px Arial";
            this.ctx.fillStyle = "#facc15";
            this.ctx.textAlign = "left";
            this.ctx.fillText("⭐ " + b.stars, b.x + 35, b.y - b.size);
          }

          // Health Bar
          let barW = 60;
          this.ctx.fillStyle = "rgba(0,0,0,0.5)";
          this.ctx.fillRect(b.x - barW / 2, b.y - b.size - 20, barW, 6);
          this.ctx.fillStyle = b.id === "player" ? "#22c55e" : "#ef4444";
          this.ctx.fillRect(b.x - barW / 2, b.y - b.size - 20, barW * (b.hp / b.maxHp), 6);
        });

        // Creatures
        this.creatures.forEach(c => {
          this.ctx.save();
          this.ctx.translate(c.x, c.y);
          if (c.type === "GEM_MINE") {
            this.ctx.fillStyle = "#334155";
            this.ctx.beginPath();
            this.ctx.arc(0, 0, 80, 0, Math.PI * 2);
            this.ctx.fill();
            this.ctx.strokeStyle = "#475569";
            this.ctx.lineWidth = 10;
            this.ctx.stroke();
            this.ctx.font = "60px Arial";
            this.ctx.textAlign = "center";
            this.ctx.fillText("💎", 0, 20);
            this.ctx.restore();
            return;
          }
          this.ctx.fillStyle = c.type === "tick_head" ? "#ef4444" : "#475569";
          this.ctx.beginPath();
          this.ctx.arc(0, 0, c.size, 0, Math.PI * 2);
          this.ctx.fill();
          this.ctx.font = "20px Arial";
          this.ctx.textAlign = "center";
          this.ctx.fillText(c.type === "tick_head" ? "💣" : "🔫", 0, 7);

          // Health Bar
          let barW = 40;
          this.ctx.fillStyle = "rgba(0,0,0,0.5)";
          this.ctx.fillRect(-barW / 2, -c.size - 10, barW, 4);
          this.ctx.fillStyle = "#ef4444";
          this.ctx.fillRect(-barW / 2, -c.size - 10, barW * (c.hp / c.maxHp), 4);
          this.ctx.restore();
        });

        this.ctx.restore();
      }

      loop() {
        this.update();
        this.draw();
        requestAnimationFrame(() => this.loop());
      }
    }
    new Game();
    </script>
  </body>
</html>
